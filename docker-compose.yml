services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
      MSSQL_SA_PASSWORD: "${SQL_SA_PASSWORD:-Your_password123}"
    ports:
      - "14330:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - "CMD-SHELL"
        - "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1'"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command:
      - "start-dev"
      - "--import-realm"
      - "--http-port=8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KEYCLOAK_ADMIN:-admin}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:-admin}"
    ports:
      - "8080:8080"
    volumes:
      - "./docker/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro"
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=InventoryDb;User Id=sa;Password=${SQL_SA_PASSWORD:-Your_password123};TrustServerCertificate=True;Encrypt=False"
      Auth__Authority: "http://keycloak:8080/realms/inventory"
      Auth__Issuer: "http://localhost:8080/realms/inventory"
      Auth__Audience: "inventory-api"
      Swagger__ClientId: "inventory-swagger"
      Swagger__AuthorizationUrl: "http://localhost:8080/realms/inventory/protocol/openid-connect/auth"
      Swagger__TokenUrl: "http://localhost:8080/realms/inventory/protocol/openid-connect/token"
      Frontend__Origin: "http://localhost:5173"
    ports:
      - "8081:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      keycloak:
        condition: service_started
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_started
volumes:
  sqlserver-data:
